services:
  - type: web
    name: vaultbank-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: online_banking
      - key: DB_SSL_CA
        sync: false
      - key: FLASK_DEBUG
        value: "0"
      - key: COOKIE_SECURE
        value: "1"

